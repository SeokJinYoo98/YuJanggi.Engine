name: UPM/NuGet Project Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Packaging / NuGet / UPM
    runs-on: windows-latest

    steps:
      # Repository
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read Workflow Config
        id: config
        shell: pwsh
        run: ./scripts/Read-WorkflowConfig.ps1

      # UPM .tgz packaging
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.config.outputs.nodeVersion }}

      # .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ steps.config.outputs.dotnetVersion }}

      # Release Variables
      # TARGET comes from workflowConfig.json
      # VERSION = v1.3.2 -> 1.3.2
      - name: Set Release Variables
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")

          "TARGET=${{ steps.config.outputs.target }}" >> $env:GITHUB_ENV
          "VERSION=$version" >> $env:GITHUB_ENV

          Write-Host "Target: ${{ steps.config.outputs.target }}"
          Write-Host "Version: $version"

      # Version.cs / csproj / package.json
      - name: Set Version
        shell: pwsh
        run: ./scripts/SetVersion.ps1 -Target $env:TARGET -Version $env:VERSION

      # Dependencies
      - name: Restore
        run: dotnet restore "${{ steps.config.outputs.solutionPath }}"

      # Build
      - name: Build
        run: dotnet build "${{ steps.config.outputs.solutionPath }}" --no-restore --configuration Release

      # Test
      - name: Test
        run: dotnet test "${{ steps.config.outputs.solutionPath }}" --no-build --configuration Release

      # Packaging: NuGet과 UPM 패키지를 같은 버전으로 생성합니다.
      - name: Packaging - Build NuGet and UPM Packages
        shell: cmd
        run: scripts\BuildPackage.bat %TARGET%

      # NuGet: 기존 CD가 GitHub Packages에 Publish할 Artifact입니다.
      - name: NuGet - Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.config.outputs.nugetArtifactName }}
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error

      # UPM: 사용자가 다운로드 후 Unity에서 로컬 설치할 Artifact입니다.
      - name: UPM - Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.config.outputs.upmArtifactName }}
          path: artifacts/upm/*.tgz
          if-no-files-found: error

      # GitHub Release
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            artifacts\nuget\* `
            --title "${{ github.ref_name }}" `
            --generate-notes
